name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build Apple Silicon binary ────────────────────────────────────────────
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Create GitHub Release and attach DMG ──────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg-aarch64-apple-darwin
          path: artifacts/arm

      - name: Rename DMG to include architecture
        run: |
          for f in artifacts/arm/*.dmg; do
            mv "$f" "${f%.dmg}_arm64.dmg"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Osmanthus ${{ github.ref_name }}
          body: |
            ## Osmanthus ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `*_arm64.dmg` |

            > **First launch:** The app is unsigned. Right-click → **Open** to bypass Gatekeeper.

            See [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md) to build from source.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/arm/*.dmg
